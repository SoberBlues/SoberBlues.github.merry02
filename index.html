<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>婚宴座位查詢系統</title>
<style>
  /* 基礎設定 */
  body {
    margin: 0;
    padding: 15px;
    font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background-color: #f8fafc;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    color: #1e293b;
  }

  .container { max-width: 800px; margin: auto; position: relative; z-index: 10; }

  /* 標題與資訊區 */
  .header-card {
    background: url('bg.jpg') center center / cover no-repeat;
    border-radius: 24px;
    padding: 30px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    border: 1px solid #e2e8f0;
    text-align: center;
    width: 100%;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  .header-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0);
    z-index: 1;
  }

  .header-card > * {
    position: relative;
    z-index: 2;
  }

  .header-title { text-align: center; font-size: 26px; font-weight: 800; color: #1e293b; margin: 5px 0 5px; letter-spacing: 1px; }
  .header-subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px; font-weight: 500; }
  
  /* 搜尋框卡片 */
  .search-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    margin-bottom: 20px;
    border: 1px solid #f1f5f9;
  }
  .search-box { display: flex; gap: 10px; }
  .search-box input { 
    flex: 1; padding: 14px 18px; font-size: 15px; border-radius: 16px; 
    border: 1.5px solid #e2e8f0; outline: none; background: #f8fafc; 
    -webkit-appearance: none; color: #1e293b;
    transition: all 0.2s;
  }
  .search-box input:focus { border-color: #f43f5e; background: #fff; box-shadow: 0 0 0 3px rgba(244,63,94,0.1); }
  .search-box button { 
    padding: 0 24px; font-size: 15px; border: none; border-radius: 16px; 
    background: #f43f5e; color: #fff; 
    cursor: pointer; font-weight: bold;
    touch-action: manipulation;
    box-shadow: 0 4px 12px rgba(244,63,94,0.25);
    transition: transform 0.1s;
  }
  .search-box button:active { transform: scale(0.96); }
  
  /* 通用卡片設計 */
  .card { 
    background: #ffffff; 
    border-radius: 24px; 
    padding: 20px; margin-bottom: 20px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    border: 1px solid #f1f5f9;
    transform: translateZ(0);
  }

  .guest-list { 
    max-height: 250px; overflow-y: auto; border: 1px solid #f1f5f9; background: #fff; 
    -webkit-overflow-scrolling: touch; border-radius: 12px;
  }

  .guest-item { 
    padding: 14px 16px; border-bottom: 1px solid #f1f5f9; 
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; cursor: pointer; transition: background 0.15s;
  }
  .guest-item:hover { background: #f8fafc; }
  
  /* 主舞台樣式 */
  .stage {
    background: radial-gradient(circle at 50% 30%, #ffe4e6 0%, #ffccd2 100%);
    color: #e11d48;
    text-align: center;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 20px;
    letter-spacing: 3px;
    width: 100%;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    border: 0.5px solid #f43f5e;
    box-shadow: 0 4px 15px rgba(244, 63, 94, 0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    box-sizing: border-box;
  }

  .stage-dot {
    width: 6px;
    height: 6px;
    background-color: #f43f5e;
    border-radius: 50%;
  }

  .seating-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 10px;
    display: flex;
    justify-content: center;
  }

  .seating { 
    display: inline-flex; flex-direction: column; align-items: center; 
    margin: 5px auto; min-width: max-content;
    padding: 5px;
  }

  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; justify-content: center; }

  /* 座位圓圈樣式 */
  .table { 
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; 
    border-radius: 50%; border: 1.5px solid #e2e8f0; background: #ffffff; 
    font-size: 12px; font-weight: bold; color: #475569; 
    text-align: center; position: relative;
    transition: all 0.2s ease;
  }

  .table.main { 
    width: 60px; height: 60px; font-size: 13px;
    border: 2px solid #ff607a;
    background: radial-gradient(circle at 60% 30%, #ffb6c1 0%, #ff6b81 100%);
    box-shadow: 0 4px 18px rgba(244, 63, 94, 0.5);
    color: #ffffff;
  }
  
  .table.vip { 
    width: 55px; height: 55px; font-size: 12px;
    border: 2px solid #8b5cf6;
    background: radial-gradient(circle at 50% 30%, #d8b4fe 0%, #7c3aed 100%);
    box-shadow: 0 4px 18px rgba(139, 92, 246, 0.5);
    color: #ffffff;
  }

  .table.aisle-space { width: 35px; border: none; background: transparent; pointer-events: none; }

  .table.highlight { 
    background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%) !important; 
    color: white !important; 
    border-width: 3.5px !important;
    border-style: solid !important;
    border-color: #ffffff !important;
    transform: none !important;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.95), 0 0 8px rgba(0, 0, 0, 0.25) !important; 
    z-index: 20; 
  }

  .badge { padding: 4px 10px; border-radius: 6px; color: white; font-size: 12px; font-weight: bold; }
  .badge.main { background: #f43f5e; }
  .badge.vip { background: #8b5cf6; }
  .badge.normal { background: #3b82f6; }

  .legend-box {
    display: flex; justify-content: center; gap: 15px; margin-top: 15px; font-size: 12px; color: #64748b; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-weight: 500; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

  footer {
    text-align: center; font-size: 12px; color: #94a3b8; margin: 30px 0 10px;
  }

  @media (max-width: 480px) {
    .table { width: 38px; height: 38px; font-size: 11px; }
    .table.main { width: 50px; height: 50px; }
    .table.vip { width: 45px; height: 45px; }
    .header-title { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- 上方標題與資訊區塊 -->
  <div class="header-card">
    <div class="header-title">駿葳 & 泯霏</div>
    <div class="header-title">婚宴座位查詢系統</div>
    <div class="header-subtitle">歡迎蒞臨！請輸入您的姓名、或桌號</div>
  </div>

  <!-- 下方：查詢系統獨立區塊 -->
  <div class="search-card">
    <h3 style="margin:0 0 12px 0; font-size: 16px;">🔍 賓客座位查詢</h3>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="請輸入姓名、或桌號(如:05、主桌、B)" onkeypress="if(event.key==='Enter') searchGuest()" enterkeyhint="search">
      <button onclick="searchGuest()">查詢</button>
    </div>
    <div id="resultContainer" style="margin-top: 15px;"></div>
  </div>

  <!-- 下方：宴會廳平面圖獨立區塊 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3 style="margin:0; font-size: 16px; display: flex; align-items: center; gap: 6px;">🗺️ 宴會廳座位平面圖</h3>
    </div>

    <div class="stage">
      <span class="stage-dot"></span>
      主舞台
      <span class="stage-dot"></span>
    </div>

    <div class="seating-wrapper">
      <div class="seating" id="seatingLayout"></div>
    </div>
    <div style="text-align: center; color: #94a3b8; font-size: 11px; margin-top: 5px;">左右滑動查看全区 ↔️</div>
    
    <div class="legend-box">
      <div class="legend-item"><div class="legend-dot" style="background:#ff6b81;"></div>主桌</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7c3aed;"></div>貴賓</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fff; border:1.5px solid #cbd5e1;"></div>嘉賓</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3b82f6;"></div>查詢定位</div>
    </div>
  </div>

  <footer>吸引力國際股份有限公司 活動用 · 座位查詢系統</footer>
</div>

<script>
let quests = [];

/* 座位對應陣列 */
const seatingLayoutData = [
  ['貴賓A', '主桌', '貴賓B'],
  ['01', '02', '03', 'aisle', '04', '05', '06'],
  ['07', '08', '09', 'aisle', '10', '11', '12'],
  ['13', '14', '15', 'aisle', '16', '17', '18'],
  ['19', '20', '21', 'aisle', '22', '23', '24'],
  ['25', '26', '27', 'aisle', '28', '29', '30'],
  ['31', '32', '33', 'aisle', '34', '35', '36'],
  ['37', '38', '39', 'aisle', '40', '41', '42'],
  ['43', '44', '45', 'aisle', '46', '47', '48'],
  ['49', '50', '51', 'aisle', '52', '53', '54']
];

async function loadQuestData() {
  try {
    const response = await fetch('quests.csv'); 
    if (!response.ok) throw new Error();
    const csvText = await response.text();
    const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== "");
    quests = lines.slice(1).map(line => {
      const columns = line.split(',').map(c => c.trim());
      return { name: columns[0], table: columns[1], count: parseInt(columns[2]) || 1, note: columns[3] || '' };
    });
  } catch (err) {
    quests = [
      { name: "王小明", table: "05", count: 1, note: "素食" },
      { name: "張麗華", table: "主桌", count: 2, note: "" },
      { name: "李大同", table: "貴賓A", count: 1, note: "" },
      { name: "陳美麗", table: "貴賓B", count: 2, note: "" },
      { name: "測試一號", table: "01", count: 1, note: "" },
      { name: "測試九號", table: "09", count: 1, note: "" }
    ];
  }
}

function searchGuest() {
  let query = document.getElementById('searchInput').value.trim();
  if (!query) return;
  document.getElementById('searchInput').blur();
  
  let upperQuery = query.toUpperCase();

  const results = quests.filter(q => {
    let qName = q.name;
    let qTable = q.table.toUpperCase();

    // 1. 判斷是否為純數字查詢（如 1 或 01）
    let isNumericQuery = /^\d+$/.test(query);

    if (isNumericQuery) {
      let queryNum = parseInt(query, 10);
      let tableNum = parseInt(qTable, 10);
      return !isNaN(tableNum) && tableNum === queryNum;
    } else {
      // 2. 姓名模糊比對
      let isNameMatch = qName.toUpperCase().includes(upperQuery);
      
      // 3. 桌號精確比對（如完整輸入 "貴賓B"）
      let isTableMatch = (qTable === upperQuery);

      // 4. 單獨輸入英文簡寫（如輸入 "B" 自動對應到包含該字母的桌號，如 "貴賓B"）
      let isAbbrMatch = qTable.includes(upperQuery) && (upperQuery.length === 1 || upperQuery.startsWith('VIP'));

      return isNameMatch || isTableMatch || isAbbrMatch;
    }
  });

  const container = document.getElementById('resultContainer');
  if (results.length === 0) {
    container.innerHTML = `<div style="text-align:center; color:#64748b; padding: 10px;">查無 "${query}" 的相關座位資訊</div>`;
    highlightTables([]);
  } else {
    container.innerHTML = `
      <div class="guest-list">
        ${results.map(q => {
          const badgeClass = q.table.includes('主桌') ? 'main' : (q.table.includes('貴賓') ? 'vip' : 'normal');
          return `<div class="guest-item" onclick="selectGuest('${q.name}')">
            <div><span style="font-weight:600; color:#1e293b;">${q.name}</span> <small style="color:#64748b;">(${q.count}位)</small></div>
            <span class="badge ${badgeClass}">${q.table}</span>
          </div>`;
        }).join('')}
      </div>`;
    highlightTables([...new Set(results.map(r => r.table))]);
  }
}

function selectGuest(name) {
  document.getElementById('searchInput').value = name;
  searchGuest();
}

function highlightTables(targetTables) {
  const seatingDiv = document.getElementById('seatingLayout');
  seatingDiv.innerHTML = '';
  
  seatingLayoutData.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';
    
    row.forEach(tableId => {
      const div = document.createElement('div');
      
      if (tableId === 'aisle') {
        div.className = 'table aisle-space';
      } else {
        let typeClass = '';
        if (tableId === '主桌') typeClass = ' main';
        else if (tableId.includes('貴賓')) typeClass = ' vip';
        
        div.className = 'table' + typeClass;
        div.textContent = tableId;
        
        // 確保 1~09 的高亮對應完全正確且不干擾其他桌號
        let isMatched = targetTables.some(t => {
          if (/^\d+$/.test(t) && /^\d+$/.test(tableId)) {
            return parseInt(t, 10) === parseInt(tableId, 10);
          }
          return t.toUpperCase() === tableId.toUpperCase();
        });

        if (isMatched) {
          div.classList.add('highlight');
          setTimeout(() => div.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }), 150);
        }
      }
      rowDiv.appendChild(div);
    });
    seatingDiv.appendChild(rowDiv);
  });
}

loadQuestData();
highlightTables([]);
</script>
</body>
</html>
